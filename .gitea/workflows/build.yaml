name: Build and push to registry

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  docker:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: |
          docker build --target test -t fastapi-app-tests .
          docker run fastapi-app-tests

      - name: Extract project version
        run: |
          VERSION=$(grep '^version' pyproject.toml | cut -d '"' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build image
        run: |
          docker buildx build \
            --target build \
            -t "${{ vars.REGISTRY_HOST_NAME }}/fbelhadj-dev/fastapi-app/fastapi-app:${VERSION}" \
            -t "${{ vars.REGISTRY_HOST_NAME }}/fbelhadj-dev/fastapi-app/fastapi-app:latest" \
            .

      - name: Login to registry
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.REGISTRY_ACCESS_TOKEN }}" | \
          docker login "${{ vars.REGISTRY_HOST_NAME }}" \
            -u "${{ secrets.REGISTRY_USER }}" \
            --password-stdin

      - name: Push image to registry
        if: github.event_name == 'push'
        run: |
          docker push "${{ vars.REGISTRY_HOST_NAME }}/fbelhadj-dev/fastapi-app/fastapi-app:${VERSION}"
          docker push "${{ vars.REGISTRY_HOST_NAME }}/fbelhadj-dev/fastapi-app/fastapi-app:latest"