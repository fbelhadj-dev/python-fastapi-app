name: Build and push to registry

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to registry
        run: |
          echo "${{ secrets.REGISTRY_ACCESS_TOKEN }}" | \
          docker login "${{ vars.REGISTRY_HOST_URL }}" \
            -u "${{ secrets.REGISTRY_USER }}" \
            --password-stdin

      - name: Extract project version
        run: |
          VERSION=$(grep '^version' pyproject.toml | cut -d '"' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build image
        run: |
          docker build \
            -t "${{ vars.REGISTRY_HOST_NAME }}/fbelhadj-dev/fastapi-app:${VERSION}" \
            -t "${{ vars.REGISTRY_HOST_NAME }}/fbelhadj-dev/fastapi-app:latest" \
            .

      - name: Push image to registry
        run: |
          docker push "${{ vars.REGISTRY_HOST_NAME }}/fbelhadj-dev/fastapi-app:${VERSION}"
          docker push "${{ vars.REGISTRY_HOST_NAME }}/fbelhadj-dev/fastapi-app:latest"